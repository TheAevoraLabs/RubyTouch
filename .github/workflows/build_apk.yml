name: Build Ruby Touch Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build-Tools and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install Ninja & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake zip zipalign apksigner

      - name: Install Qt 6.6.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtquickcontrols2 qtsvg'
          cache: true

      - name: Build and Package APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          QT_DIR: ${{ env.Qt6_DIR }}
        run: |
          chmod +x build_android.sh
          # Run build using CI environment paths
          ./build_android.sh || {
            echo "Direct script build failed, falling back to CMake package configuration..."
            cmake -S src/ruby/android -B build-ci \
              -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID_STL=c++_shared \
              -DCMAKE_FIND_ROOT_PATH="${QT_DIR}" \
              -DCMAKE_PREFIX_PATH="${QT_DIR}"
            cmake --build build-ci --config Release -j$(nproc)
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RubyTouch-v1.1-arm64-v8a
          path: |
            bin/*.apk
            build-android/*.apk
          if-no-files-found: warn

      - name: Upload to GitHub Release (Tags Only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/*.apk
          generate_release_notes: true
