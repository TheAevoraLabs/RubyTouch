name: Build Ruby Touch Android APK

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Publish official GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Custom tag override (e.g. v1.2, leave empty for manifest version)'
        required: false
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[ga]') ||
      contains(github.event.head_commit.message, '[GA]') ||
      contains(github.event.head_commit.message, '[release') ||
      contains(github.event.head_commit.message, '[RELEASE')
    outputs:
      is_release: ${{ steps.meta.outputs.is_release }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      base_version: ${{ steps.meta.outputs.base_version }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code_base: ${{ steps.meta.outputs.version_code_base }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_num: ${{ steps.meta.outputs.build_num }}
      build_date: ${{ steps.meta.outputs.build_date }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version and Build Metadata
        id: meta
        env:
          EVENT_COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          BASE_VERSION="$(grep -o 'android:versionName="[^"]*"' src/ruby/android/AndroidManifest.xml | head -n1 | cut -d'"' -f2 || echo "1.2")"
          MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-2}"

          BUILD_NUM="${{ github.run_number }}"
          BASE_CODE=$(( MAJOR * 100000 + MINOR * 1000 + BUILD_NUM ))
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          BUILD_DATE="$(date -u +%Y%m%d)"

          COMMIT_MSG="${EVENT_COMMIT_MSG:-}"
          if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          fi

          IS_RELEASE=false
          RELEASE_TAG=""

          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
              IS_RELEASE=true
              RELEASE_TAG="${{ github.ref_name }}"
          elif [[ "${{ inputs.force_release }}" == "true" ]]; then
              IS_RELEASE=true
              RELEASE_TAG="${INPUT_RELEASE_TAG:-}"
              if [ -z "$RELEASE_TAG" ]; then
                  RELEASE_TAG="v${BASE_VERSION}"
              fi
          elif echo "$COMMIT_MSG" | grep -qiE '\[release[^]]*\]'; then
              IS_RELEASE=true
              CUSTOM_TAG="$(echo "$COMMIT_MSG" | grep -oiE '\[release[^]]*\]' | head -n1 | tr -d '[]' | awk '{print $2}' || true)"
              if [ -n "$CUSTOM_TAG" ]; then
                  if [[ "$CUSTOM_TAG" =~ ^v ]]; then
                      RELEASE_TAG="$CUSTOM_TAG"
                  else
                      RELEASE_TAG="v$CUSTOM_TAG"
                  fi
              else
                  RELEASE_TAG="v${BASE_VERSION}"
              fi
          fi

          CLEAN_VERSION="${RELEASE_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION:-$BASE_VERSION}"

          if [ "$IS_RELEASE" = "true" ]; then
              VERSION_NAME="${CLEAN_VERSION}"
              DISPLAY_VERSION="${RELEASE_TAG}"
          else
              VERSION_NAME="${BASE_VERSION}b${BUILD_NUM}-${SHORT_SHA}"
              DISPLAY_VERSION="v${BASE_VERSION}-b${BUILD_NUM} (${SHORT_SHA})"
          fi

          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code_base=${BASE_CODE}" >> $GITHUB_OUTPUT
          echo "display_version=${DISPLAY_VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          echo "============================================="
          echo "  Build Tracker:     #${BUILD_NUM}"
          echo "  Base Version:      ${BASE_VERSION}"
          echo "  Base Code:         ${BASE_CODE}"
          echo "  Version Name:      ${VERSION_NAME}"
          echo "  Is Official Rel:   ${IS_RELEASE}"
          echo "  Release Tag:       ${RELEASE_TAG}"
          echo "============================================="

  build:
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            qt_arch: android_arm64_v8a
            abi_code: 4
            arch_label: "ARM64 v8a (64-bit)"
          - abi: armeabi-v7a
            qt_arch: android_armv7
            abi_code: 2
            arch_label: "ARMv7 (32-bit)"
          - abi: x86_64
            qt_arch: android_x86_64
            abi_code: 6
            arch_label: "x86_64 (64-bit)"
          - abi: x86
            qt_arch: android_x86
            abi_code: 3
            arch_label: "x86 (32-bit)"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute ABI Specific Metadata
        id: abi_meta
        run: |
          ABI="${{ matrix.abi }}"
          ABI_CODE="${{ matrix.abi_code }}"
          BASE_CODE="${{ needs.metadata.outputs.version_code_base }}"
          VERSION_CODE=$(( BASE_CODE * 10 + ABI_CODE ))

          IS_RELEASE="${{ needs.metadata.outputs.is_release }}"
          RELEASE_TAG="${{ needs.metadata.outputs.release_tag }}"
          BASE_VER="${{ needs.metadata.outputs.base_version }}"
          BUILD_NUM="${{ needs.metadata.outputs.build_num }}"
          SHORT_SHA="${{ needs.metadata.outputs.short_sha }}"

          if [ "$IS_RELEASE" = "true" ]; then
              APK_FILE="RubyTouch-${RELEASE_TAG}-${ABI}.apk"
              ARTIFACT_NAME="RubyTouch-${RELEASE_TAG}-${ABI}"
          else
              APK_FILE="RubyTouch-v${BASE_VER}-b${BUILD_NUM}-${SHORT_SHA}-${ABI}.apk"
              ARTIFACT_NAME="RubyTouch-v${BASE_VER}-b${BUILD_NUM}-${SHORT_SHA}-${ABI}"
          fi

          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "apk_file=${APK_FILE}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

          echo "Target ABI:        ${ABI}"
          echo "Version Code:      ${VERSION_CODE}"
          echo "Output APK:        ${APK_FILE}"
          echo "Artifact:          ${ARTIFACT_NAME}"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake zip zipalign apksigner

      - name: Install Qt 6.6.3 for ${{ matrix.arch_label }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'android'
          arch: '${{ matrix.qt_arch }}'
          modules: 'qtimageformats qtshadertools'
          cache: true

      - name: Build and Package APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/27.0.12077973
          export QT_DIR="${QT_ROOT_DIR:-}"
          export RUBY_TARGET_ABI="${{ matrix.abi }}"
          export RUBY_VERSION_NAME="${{ needs.metadata.outputs.version_name }}"
          export RUBY_VERSION_CODE="${{ steps.abi_meta.outputs.version_code }}"
          export RUBY_APK_NAME="${{ steps.abi_meta.outputs.apk_file }}"

          chmod +x build_android.sh
          chmod +x src/ruby/android/build_android.sh
          ./build_android.sh --abi "${{ matrix.abi }}"

          cd bin
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.abi_meta.outputs.artifact_name }}
          path: |
            bin/*.apk
            bin/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download All APK Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_apks
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          mkdir -p dist
          find all_apks -name "*.apk" -exec cp {} dist/ \;
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          echo "Consolidated Checksums:"
          cat SHA256SUMS.txt

      - name: Upload All Architecture APKs Bundle
        uses: actions/upload-artifact@v4
        with:
          name: RubyTouch-${{ needs.metadata.outputs.version_name }}-all-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: needs.metadata.outputs.is_release == 'true'
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: "Ruby Touch (Ruby Mobile) ${{ needs.metadata.outputs.release_tag }}"
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
