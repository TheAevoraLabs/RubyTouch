name: Build Ruby Touch Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Publish official GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Custom tag override (e.g. v1.2, leave empty for manifest version)'
        required: false
        default: ''

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Version and Build Metadata
        id: meta
        env:
          EVENT_COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # 1. Base version from AndroidManifest.xml
          BASE_VERSION="$(grep -o 'android:versionName="[^"]*"' src/ruby/android/AndroidManifest.xml | head -n1 | cut -d'"' -f2 || echo "1.1")"
          MAJOR="$(echo "$BASE_VERSION" | cut -d. -f1)"
          MINOR="$(echo "$BASE_VERSION" | cut -d. -f2)"
          MAJOR="${MAJOR:-1}"
          MINOR="${MINOR:-1}"

          # 2. Monotonically increasing build tracker from GitHub Actions
          BUILD_NUM="${{ github.run_number }}"
          VERSION_CODE=$(( MAJOR * 100000 + MINOR * 1000 + BUILD_NUM ))
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          BUILD_DATE="$(date -u +%Y%m%d)"

          # 3. Detect release trigger:
          #    a) Git tag push (v*)
          #    b) Manual workflow dispatch with force_release=true
          #    c) Commit message contains [release] or [release vX.Y]
          COMMIT_MSG="${EVENT_COMMIT_MSG:-}"
          if [ -z "$COMMIT_MSG" ]; then
              COMMIT_MSG="$(git log -1 --pretty=%B 2>/dev/null || true)"
          fi

          IS_RELEASE=false
          RELEASE_TAG=""

          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
              IS_RELEASE=true
              RELEASE_TAG="${{ github.ref_name }}"
          elif [[ "${{ inputs.force_release }}" == "true" ]]; then
              IS_RELEASE=true
              RELEASE_TAG="${INPUT_RELEASE_TAG:-}"
              if [ -z "$RELEASE_TAG" ]; then
                  RELEASE_TAG="v${BASE_VERSION}"
              fi
          elif echo "$COMMIT_MSG" | grep -qiE '\[release[^\]]*\]'; then
              IS_RELEASE=true
              CUSTOM_TAG="$(echo "$COMMIT_MSG" | grep -oiE '\[release\s+v?[0-9.]+\]' | head -n1 | tr -d '[]' | awk '{print $2}' || true)"
              if [ -n "$CUSTOM_TAG" ]; then
                  if [[ "$CUSTOM_TAG" =~ ^v ]]; then
                      RELEASE_TAG="$CUSTOM_TAG"
                  else
                      RELEASE_TAG="v$CUSTOM_TAG"
                  fi
              else
                  RELEASE_TAG="v${BASE_VERSION}"
              fi
          fi

          CLEAN_VERSION="${RELEASE_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION:-$BASE_VERSION}"

          if [ "$IS_RELEASE" = "true" ]; then
              VERSION_NAME="${CLEAN_VERSION}"
              APK_CANONICAL_NAME="RubyTouch-${RELEASE_TAG}-arm64-v8a.apk"
              DISPLAY_VERSION="${RELEASE_TAG}"
              ARTIFACT_NAME="RubyTouch-${RELEASE_TAG}-arm64-v8a"
          else
              # Version-backed in-between dev / beta build: e.g. 1.1b14-daba4ec
              VERSION_NAME="${BASE_VERSION}b${BUILD_NUM}-${SHORT_SHA}"
              APK_CANONICAL_NAME="RubyTouch-v${BASE_VERSION}-b${BUILD_NUM}-${SHORT_SHA}-arm64-v8a.apk"
              DISPLAY_VERSION="v${BASE_VERSION}-b${BUILD_NUM} (${SHORT_SHA})"
              ARTIFACT_NAME="RubyTouch-v${BASE_VERSION}-b${BUILD_NUM}-${SHORT_SHA}"
          fi

          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "apk_canonical_name=${APK_CANONICAL_NAME}" >> $GITHUB_OUTPUT
          echo "display_version=${DISPLAY_VERSION}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          echo "============================================="
          echo "  Build Tracker:     #${BUILD_NUM}"
          echo "  Base Version:      ${BASE_VERSION}"
          echo "  Version Code:      ${VERSION_CODE}"
          echo "  Version Name:      ${VERSION_NAME}"
          echo "  APK Name:          ${APK_CANONICAL_NAME}"
          echo "  Artifact Name:     ${ARTIFACT_NAME}"
          echo "  Is Official Rel:   ${IS_RELEASE}"
          echo "  Release Tag:       ${RELEASE_TAG}"
          echo "============================================="

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake zip zipalign apksigner

      - name: Install Qt 6.6.3 for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qtimageformats qtshadertools'
          cache: true

      - name: Build and Package APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/27.0.12077973
          export QT_DIR="${QT_ROOT_DIR:-}"
          export RUBY_VERSION_NAME="${{ steps.meta.outputs.version_name }}"
          export RUBY_VERSION_CODE="${{ steps.meta.outputs.version_code }}"
          export RUBY_APK_NAME="${{ steps.meta.outputs.apk_canonical_name }}"
          chmod +x build_android.sh
          chmod +x src/ruby/android/build_android.sh
          ./build_android.sh

          # Generate SHA256 checksums manifest
          cd bin
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            bin/*.apk
            bin/SHA256SUMS.txt
          if-no-files-found: warn

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.meta.outputs.is_release == 'true'
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "Ruby Touch (Ruby Mobile) ${{ steps.meta.outputs.release_tag }}"
          files: |
            bin/*.apk
            bin/SHA256SUMS.txt
          generate_release_notes: true
